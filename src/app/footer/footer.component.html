<footer class="bg-rojo" >
    <div class="mx-auto w-full max-w-screen-xl p-4 py-6 lg:py-8">
        <div class="md:flex md:justify-between">
          <div class="mb-6 md:mb-0">
              <a  class="flex items-center">
                  <img src="LOGO_SHOPPERS_20241-white.png" class="h-14 me-3" alt="Shoppers Logo" />
                  <!-- <span class="self-center text-2xl font-semibold whitespace-nowrap text-white">{{title}}</span> -->
              </a>
          </div>
          <div class="grid grid-cols-2 gap-8 sm:gap-6 sm:grid-cols-3">
              <div class="sm:col-start-3 sm:cols-end-4 cols-start-1 cols-end-2">
                  <h2 class="mb-6 text-sm font-semibold uppercase text-white">Contactanos</h2>
                  <ul class="text-white font-medium">
                      <li class="mb-4">
                          <a href="#" class="hover:underline">Privacy Policy</a>
                      </li>
                      <li>
                          <a href="#" class="hover:underline">Terms &amp; Conditions</a>
                      </li>
                  </ul>
              </div>
          </div>
      </div>
      <hr class="my-6 border-white sm:mx-auto  lg:my-8" />
      <div class="sm:flex sm:items-center sm:justify-between">
          <span class="text-sm text-white">© {{year}} <a  class="hover:underline">{{title}}</a>. Todos los Derechos Reservados.
          </span>
          <div class="flex mt-4 sm:justify-center sm:mt-0">
            @for (item of socialMedia; track item) {
              <a href={{item.link}} class="text-white" target="_blank" rel="noopener noreferrer">
                  <mat-icon>{{item.icon}}</mat-icon>
              </a>
            }
          </div>
      </div>
    </div>
</footer>
