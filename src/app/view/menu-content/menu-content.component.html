

<div [style.transform]="visible?'translate(0%)':'translate(100%)'" class="fixed lg:hidden inset-0 bg-gray-500/75  transition-all z-10" >
    <div class="relative h-full w-full max-w-screen-xl mx-auto">
  
      <div class="sm:max-w-lg pt-[84px] absolute h-full left-0 w-full">
        <div class="flex  flex-col  bg-white shadow-xl  relative h-full">
          <div class="flex-1 flex flex-col px-4 py-6 sm:px-6 gap-8">
            <div class="flex items-start justify-between">
              <h2 class="text-lg font-medium text-gray-900" id="slide-over-title">Menú</h2>
              <div class="ml-3 flex h-7 items-center">
                <button type="button" (click)="visible=false" class="relative -m-2 p-2 text-gray-400 hover:text-gray-500">
                  <span class="absolute -inset-0.5"></span>
                  <span class="sr-only">Close panel</span>
                  <i class="pi pi-times" style="font-size: 1.25rem;"></i>
                </button>
              </div>
            </div>
  
            <div class="flex-1   overflow-y-auto pr-2 w-full" >
                <ul role="list" class="-my-6 divide-y divide-gray-200 w-full block  " >
                  <li class="flex py-6 w-full items-center gap-1" >
                    <app-input-search class="w-full" (closeMenu)="visible=false"></app-input-search >
                  </li>
                  <li class="flex py-6 w-full items-center gap-1" >
                    <app-select-categorie class="w-full" (closeMenu)="visible=false"></app-select-categorie>
                  </li>
                  <!-- More products... -->
                </ul>
              
            </div>
          </div>
  

        </div>
      </div>
    </div>
  </div>
