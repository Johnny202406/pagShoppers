<div [class.translate-x-0]="visibleMovil" class="md:translate-x-0 -translate-x-[105%] md:relative absolute w-full h-full min-h-max   left-0  transition-all z-10">
  <div class="border border-gray-200 shadow-sm md:w-56 bg-white min-h-max h-full w-full md:rounded-tr-lg">
    <div class="flex items-start justify-between py-2 px-4 text-gray-900">
      <h2 class="text-lg font-medium text-rojo" id="slide-over-title">Filtros</h2>
      <i class="pi pi-eraser text-gray-950 cursor-pointer" (click)="clearFilters()" style="font-size: 1.25rem;"></i>
      <div class="ml-3 md:hidden h-7 items-center flex">
        <button type="button" (click)="visibleMovil=false" class="relative -m-2 p-2 text-gray-400 hover:text-gray-500">
          <span class="absolute -inset-0.5"></span>
          <span class="sr-only">Close panel</span>
          <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" data-slot="icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <div class="border-t border-gray-200 px-4 py-6 filter">
      <h3 class="-mx-2 -my-3 flow-root">
        <button (click)="toggleDetail(0)" type="button" class="flex w-full items-center justify-between bg-white px-2 py-3 text-gray-400 hover:text-gray-500">
          <span class="font-medium text-gray-900">Disponibilidad</span>
          <span class="ml-6 flex items-center">
            <i class="pi {{openDetails[0] ? 'pi-plus' : 'pi-minus'}} text-rojo"></i>
          </span>
        </button>
      </h3>
      <div class="pt-6" id="filter-section-mobile-0" [class.hidden]="openDetails[0]">
        <div class="space-y-6">
          <div class="flex gap-3">
            <div class="flex h-5 shrink-0 items-center">
              <div class="group grid size-4 grid-cols-1">
                <input id="solo-con-stock"  name="solo-con-stock"  type="checkbox" [(ngModel)]="onlyWithStock" class="col-start-1 row-start-1 appearance-none rounded border border-gray-300 bg-white checked:border-rojo checked:bg-rojo focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rojo" (change)="onFilterChange()" />
                <svg class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white" viewBox="0 0 14 14" fill="none">
                  <path class="opacity-0 group-has-[:checked]:opacity-100" d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
            </div>
            <label for="solo-con-stock" class="min-w-0 flex-1 text-gray-500">Solo con stock</label>
          </div>
        </div>
      </div>
    </div>

    <div class="border-t border-gray-200 px-4 py-6 filter">
      <h3 class="-mx-2 -my-3 flow-root">
        <button (click)="toggleDetail(1)" type="button" class="flex w-full items-center justify-between bg-white px-2 py-3 text-gray-400 hover:text-gray-500">
          <span class="font-medium text-gray-900">Precio</span>
          <span class="ml-6 flex items-center">
            <i class="pi {{openDetails[1] ? 'pi-plus' : 'pi-minus'}} text-rojo"></i>
          </span>
        </button>
      </h3>
      <div class="pt-6" id="filter-section-mobile-1" [class.hidden]="openDetails[1]">
        <div class="space-y-6">
          <div class="col-span-2 flex items-center justify-between space-x-2">
            <input type="number" step="0.1" id="min-price-input" name="min-price-input" [(ngModel)]="minPrice"  min="0" max="7000" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-rojo focus:ring-rojo outline-none" placeholder="" required (change)="onFilterChange()" />
            <div class="shrink-0 text-sm font-medium text-gray-700">a</div>
            <input type="number" step="0.1" id="max-price-input" name="max-price-input" [(ngModel)]="maxPrice"  min="0" max="7000" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-rojo focus:ring-rojo outline-none" placeholder="" required (change)="onFilterChange()" />
          </div>
        </div>
      </div>
    </div>

    <div class="border-t border-gray-200 px-4 py-6 filter">
      <h3 class="-mx-2 -my-3 flow-root">
        <button (click)="toggleDetail(2)" type="button" class="flex w-full items-center justify-between bg-white px-2 py-3 text-gray-400 hover:text-gray-500">
          <span class="font-medium text-gray-900">Marca</span>
          <span class="ml-6 flex items-center">
            <i class="pi {{openDetails[2] ? 'pi-plus' : 'pi-minus'}} text-rojo"></i>
          </span>
        </button>
      </h3>
      <div class="pt-6" id="filter-section-mobile-2" [class.hidden]="openDetails[2]">
        <div class="space-y-6">
          @for (item of marcas; track $index) {
            <div   class="flex gap-3">
              <div class="flex h-5 shrink-0 items-center">
                <div class="group grid size-4 grid-cols-1">
                  <input [id]="item.marca" name="marca"  [(ngModel)]="selectedMarcas[item.marca]"   type="checkbox" class="col-start-1 row-start-1 appearance-none rounded border border-gray-300 bg-white checked:border-rojo checked:bg-rojo focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rojo" (change)="onFilterChange()" />
                  <svg class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white" viewBox="0 0 14 14" fill="none">
                    <path class="opacity-0 group-has-[:checked]:opacity-100" d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </div>
              </div>
              <label [for]="item.marca" class="min-w-0 flex-1 text-gray-500">{{ item.marca }} ({{ item.cantidad }})</label>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
