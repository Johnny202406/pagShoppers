<div class=" shadow-md sm:rounded-lg max-w-2xl flex-none">
      <div class="flex items-center justify-between  w-full flex-wrap  py-4 bg-white px-2 gap-2">
        <p-button label="Agregar " (onClick)="showDialog()"/>
        <p-floatlabel class="w-64" variant="on">
            <p-select 
            [options]="Estados" 
            [(ngModel)]="selectedEstado" 
            optionLabel="label"   
            [showClear]="true" 
            class="w-64" >

            <ng-template #selectedItem let-selectedEstado>
                <div class="flex items-center gap-2">
                    <div class="truncate">{{ selectedEstado.label }}</div>
                </div>
            </ng-template>

            <ng-template let-estado #item>
                <div class="flex items-center gap-2">
                    <div>{{ estado.label }}</div>
                </div>
            </ng-template>
            </p-select>
            <label for="on_label" >Estado</label>
        </p-floatlabel>
        <p-floatlabel variant="on">
          <input pInputText id="on_label" [(ngModel)]="inputValue" classs="w-64" autocomplete="off" />
          <label for="on_label">Búsqueda por nombre</label>
        </p-floatlabel>
        <p-button label="Buscar" severity="danger" (click)="search()" [rounded]="true" />
      </div>
      @if (marcas.length>0) {
      <p-table #dt
          showGridlines 
          [value]="marcas" 
          [tableStyle]="{'max-width': '100%'}" 
          [rows]="pageSize" 
          [paginator]="true"  
          [rowsPerPageOptions]="[5, 10, 15]"  
          [totalRecords]="totalRecords" 
          (onLazyLoad)="loadCustomers($event)"
          [lazy]="true"
        >
    
    <ng-template pTemplate="header">
      <tr>
        <th style="width:60%">
          Nombre 
        </th>
         <th  style="width:5%">
          Habilitado 
        </th>
        <th style="width:5%">
          Editar
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-marca>
      <tr>
        <td>{{ marca.nombre }}</td>
         <td>
          <p-checkbox [ngModel]="marca.habilitado" [binary]="true" (onChange)="habilitarDeshabilitar(marca)" />
        </td>
        <td>
          <div class="text-rojo cursor-pointer flex justify-center" (click)="editMarca(marca)">
            <i class="pi pi-file-edit" style="font-size:1.25rem;font-weight:bolder;"></i>
          </div>
        </td>
      </tr>
    </ng-template>

      </p-table>
    }@else {
      <p class="px-2 py-4">No hay registros de Marcas...</p>
    }

  </div>


  <!-- MODAL -->
<p-dialog [header]="marcaId?'Actualizar Marca':'Crear Marca'" [position]="position" [modal]="true" [(visible)]="visibleModal" [style]="{ width: '25rem',height:'auto' }">
  <form [formGroup]="miFormulario" (ngSubmit)="operacionesMarca()">
    
    <div class="flex items-center gap-4 mb-4">
      <label for="nombre" class="font-semibold w-24">Nombre</label>
      <input pInputText type="text" id="nombre" formControlName="nombre" class="flex-auto" />
    </div>
    <small *ngIf="miFormulario.get('nombre')?.invalid && miFormulario.get('nombre')?.touched" class="text-red-500">
        El nombre es obligatorio y debe tener menos de 255 caracteres.
    </small>

    <div class="flex justify-end gap-2  bottom-4 right-4">
      <p-button label="Cancelar" severity="secondary" (click)="showDialog()" />
      <p-button [label]="marcaId?'Actualizar':'Crear'" [type]="'submit'" [disabled]="miFormulario.invalid"></p-button>
    </div>
  </form>
</p-dialog>
