

<div [style.transform]="visible?'translate(0%)':'translate(100%)'" class="fixed inset-0 bg-gray-500/75  transition-all " >
  <div class="relative h-full w-full max-w-screen-xl mx-auto">

    <div class="sm:max-w-lg pt-[84px] absolute h-full right-0 w-full">
      <div class="flex  flex-col  bg-white shadow-xl  relative h-full">
        <div class="flex-1 flex flex-col px-4 py-6 sm:px-6 gap-8">
          <div class="flex items-start justify-between">
            <h2 class="text-lg font-medium text-gray-900" id="slide-over-title">Carrito de Compras</h2>
            <div class="ml-3 flex h-7 items-center">
              <button type="button" (click)="visible=false" class="relative -m-2 p-2 text-gray-400 hover:text-gray-500">
                <span class="absolute -inset-0.5"></span>
                <span class="sr-only">Close panel</span>
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"  data-slot="icon">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>

          <div class="   overflow-y-scroll pr-2 w-full" style="height: calc(100dvh - 405px);scroll-behavior: smooth;scroll-snap-type: y mandatory;">
              <ul role="list" class="-my-6 divide-y divide-gray-200 w-full block" >
                
                
                
                <li class="flex py-6 w-full items-center gap-1" style="scroll-snap-align: start;scroll-snap-stop: always;">
                  <div class="size-28 shrink-0 overflow-hidden rounded-md border border-gray-200">
                    <a >
                      <img src="https://tailwindcss.com/plus-assets/img/ecommerce-images/shopping-cart-page-04-product-01.jpg" alt="Salmon orange fabric pouch with match zipper, gray zipper pull, and adjustable hip belt." class="size-full object-contain">
                    </a>
                  </div>

                  <div class="flex  flex-col w-full h-[110px] justify-between">
                   
                      <div class="grid grid-cols-[1fr,10px,24px]  text-base font-medium text-gray-900 w-full">
                        <h3 class=" h-8  text-sm leading-4" style="display: -webkit-box;
                        -webkit-line-clamp: 2;
                        -webkit-box-orient: vertical;
                        line-clamp: 2;width: 100%; overflow: hidden; " >
                          Throwback Hip Bagdddddd dddd ddYQÑd aaaaaaaaqljltyaa aaaaaaaaaaaaaa  aaaaa aaaaa qa
                        </h3>
                        <button (click)="confirmar()" type="button" class="font-medium text-rojo hover:rojo-hover self-start col-start-3 col-end-4 ">
                          
                          <svg class="size-6 " fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"  data-slot="icon">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                      <div class="flex flex-col sm-360:flex-row justify-between items-center  text-base font-medium text-gray-900 ">
                        <p class="  text-rojo font-medium text-base"> S/1000.00</p>
                        <form class=" ">
                          <div class="relative flex items-center  justify-center">
                              <button type="button" id="decrement-button" data-input-counter-decrement="quantity-input" class="bg-rojo  hover:bg-rojo-hover   rounded-s-md  p-2 h-7 sm-360:h-8">
                                  <svg class="w-3 h-3 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 2">
                                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h16"/>
                                  </svg>
                              </button>
                              <input type="text" id="quantity-input" data-input-counter data-input-counter-min="1" data-input-counter-max="50" aria-describedby="helper-text-explanation" class="bg-white border-x-0 border-gray-200 h-7 sm-360:h-8 text-center text-black text-sm w-10 font-medium border focus:outline-none" placeholder="999" value="0" required />
                              <button type="button" id="increment-button" data-input-counter-increment="quantity-input" class="bg-rojo  hover:bg-rojo-hover   rounded-e-md p-2 h-7 sm-360:h-8">
                                  <svg class="w-3 h-3 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 18">
                                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 1v16M1 9h16"/>
                                  </svg>
                              </button>
                          </div>
                        </form>
                      </div>
                    
                      
                      <p> <span class="text-xs">Subtotal: </span>  <span class="text-base font-medium ">S/9000.00</span></p>
                      
                  </div>
                </li>
                

                <!-- More products... -->
              </ul>
            
          </div>
        </div>

        <div class="border-t border-gray-200 px-4 py-6 sm:px-6   w-full">
          <div class="flex justify-between text-base font-medium text-gray-900">
            <p>Subtotal</p>
            <p>$262.00</p>
          </div>
          <p class="mt-0.5 text-sm text-gray-500">Shipping and taxes calculated at checkout.</p>
          <div class="mt-6">
            <a href="#" class="flex items-center justify-center rounded-md border border-transparent bg-rojo px-6 py-3 text-base font-medium text-white shadow-sm hover:bg-rojo-hover">Enviar</a>
          </div>
          <div class="mt-6 flex justify-center text-center text-sm text-gray-500">
            <p>
              or
              <button type="button" class="font-medium text-rojo hover:text-rojo-hover">
                Enviar a WhatsApp
                <span > &rarr;</span>
              </button>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
