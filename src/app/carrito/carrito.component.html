

<div [style.transform]="visible?'translate(0%)':'translate(100%)'" class="fixed inset-0 bg-gray-500/75  transition-all z-20" >
  <div class="relative h-full w-full max-w-screen-xl mx-auto">

    <div class="sm:max-w-lg pt-[84px] absolute h-full right-0 w-full">
      <div class="flex  flex-col  bg-white shadow-xl  relative h-full">
        <div class="flex-1 flex flex-col px-4 py-6 sm:px-6 gap-8">
          <div class="flex items-start justify-between">
            <h2 class="text-lg font-medium text-gray-900" id="slide-over-title">Carrito de Compras</h2>
            <div class="ml-3 flex h-7 items-center">
              <button type="button" (click)="visible=false" class="relative -m-2 p-2 text-gray-400 hover:text-gray-500">
                <span class="absolute -inset-0.5"></span>
                <span class="sr-only">Close panel</span>
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"  data-slot="icon">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>

          <div class="   overflow-y-auto pr-2 w-full" style="height: calc(100dvh - 405px);scroll-behavior: smooth;scroll-snap-type: y mandatory;">
              <ul role="list" class="-my-6 divide-y divide-gray-200 w-full block" >
                <app-cards-carrito></app-cards-carrito>
                <!-- More products... -->
              </ul>
            
          </div>
        </div>

        <div class="border-t border-gray-200 px-4 py-6 sm:px-6   w-full">
          <div class="flex justify-between text-base font-medium text-gray-900">
            <p>Total</p>
            <p>$262.00</p>
          </div>
          <p class="mt-0.5 text-sm text-gray-500">Revisa los detalles de tu pedido antes de continuar.</p>
          <div class="mt-6">
            <a href="#" class="flex items-center justify-center rounded-md border border-transparent bg-rojo px-6 py-3 text-base font-medium text-white shadow-sm hover:bg-rojo-hover">Enviar</a>
          </div>
          <div class="mt-6 flex justify-center text-center text-sm text-gray-500">
            <p>
              or
              <button type="button" class="font-medium text-rojo hover:text-rojo-hover">
                Enviar a WhatsApp
                <span > &rarr;</span>
              </button>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
